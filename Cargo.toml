[package]
name = "mlocate"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mlocate"
path = "src/bin/mlocate.rs"

[[bin]]
name = "mupdatedb"
path = "src/bin/mupdatedb.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
duckdb = { version = "1.1", features = ["bundled"] }
ignore = "0.4"
crossbeam-channel = "0.5"
dashmap = "6.0"
infer = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
humantime = "2.1"
bytesize = { version = "1.3", features = ["serde"] }
comfy-table = "7.1"
is-terminal = "0.4"
colored = "2.1"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search"
harness = false
