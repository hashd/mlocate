[package]
name = "mlocate"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mlocate"
path = "src/bin/mlocate.rs"

[[bin]]
name = "mupdatedb"
path = "src/bin/mupdatedb.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
roaring = "0.10"
zstd = "0.13"
memmap2 = "0.9"
regex = "1"
hostname = "0.4"
ignore = "0.4"
crossbeam-channel = "0.5"
dashmap = "6.0"
infer = "0.16"
mime_guess = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comfy-table = "7.1"
is-terminal = "0.4"
colored = "2.1"
term_size = "0.3"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3.4"
shlex = "1.3"
signal-hook = "0.3"
caseless = "0.2"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[test]]
name = "smoke"
path = "tests/integration/smoke.rs"

[[test]]
name = "compat"
path = "tests/integration/compat.rs"

[[test]]
name = "gnucmd"
path = "tests/integration/gnucmd.rs"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search"
harness = false
